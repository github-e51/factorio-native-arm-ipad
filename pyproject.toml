[project]
name = "factorio-native-arm-ipad"
version = "0.1.0"
description = "Build an experimental iPad port from owned Factorio 2.0.77 or 2.1.24 Space Age installations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ty.environment]
extra-paths = ["tools"]
